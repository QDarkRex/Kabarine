# Bot settings. Mounted into the container, so changes here only need
# `docker compose restart` (no rebuild). Anything left out falls back to the
# defaults in src/config.py.

prefix: "!"
activity_name: "TikTok"

# Monitoring (paced scheduler — sweeps all tracked accounts, evenly spaced)
sweep_target_seconds: 150   # re-check each account roughly every ~2.5 min
min_request_spacing: 1.5    # safety floor: never request faster than this (seconds)
request_jitter: 0.5         # +/- random seconds added to spacing (less robotic)
playlist_scan_count: 5      # how many recent videos to scan per check

# TikTok stories (/tt add type:stories) — own, slower poller. A story stays up 24h,
# so a check every ~10 min is plenty and keeps the request rate low.
tiktok_story_enabled: true          # false = stop polling stories (subscriptions are kept)
tiktok_story_sweep_seconds: 600     # re-check each story subscription roughly this often
tiktok_story_min_spacing: 3         # never request faster than this (seconds)

# On-demand
auto_detect_links: true      # auto-download TikTok/Instagram/X links pasted in chat
x_auto_detect_links: true    # X/Twitter links only; posts WITHOUT media are ignored (people share X links a lot)
suppress_link_embeds: true   # remove Discord's auto link-preview embed after the bot reposts it (needs "Manage Messages")

# Instagram (/ig command)
download_timeout: 180     # kill a gallery-dl download that runs longer than this (seconds)
max_files_per_post: 20    # safety cap on media files pulled from one IG carousel
ig_proxy_fallback: true   # if gallery-dl gets nothing (login wall / no cookies), try a cookie-free
                          # public mirror. PUBLIC posts only; carousels return their FIRST item;
                          # private posts still can't be fetched.
ig_monitoring_enabled: true   # false = downloader-only: /ig get + pasted links still work, but the
                              # /ig add auto-feed pollers DON'T run. The burner cookie is then used only
                              # on demand, so it lasts far longer — a good idea on a datacenter IP.

# Instagram monitoring (/ig add) — deliberately SLOW: Instagram flags aggressive
# automated access. Accounts are sharded across the configured burners (IG_COOKIES),
# and each value below is applied PER BURNER. With 2 burners over ~45 accounts this
# lands new posts within ~10–15 min.
ig_sweep_target_seconds: 900    # per burner: re-check each of its accounts this often
ig_min_request_spacing: 20      # never request faster than this (seconds, per burner)
ig_request_jitter: 5            # +/- random seconds added to spacing
ig_playlist_scan_count: 3       # how many recent posts to scan per check

# TikTok video quality
tiktok_native: true       # true = native resolution even if h265 1080p (may not inline-preview on some
                          # clients); false = force h264 so it always plays inline (can cap TikTok at 720p)

# Download safety limits — a LIVE stream never ends, so without these yt-dlp would
# stream it forever: the bot looks stuck "typing", the worker thread leaks and the
# growing file fills the disk. Live/profile links are refused up front too.
tiktok_download_timeout: 180   # abort a TikTok download running longer than this (seconds)
max_download_mb: 300           # abort a TikTok download bigger than this

# Health alerts — the bot DMs its owner (or posts in health_alert_channel_id) when
# forwarding breaks: a stuck poller, most accounts unreadable (often a yt-dlp/gallery-dl
# that needs upgrading — the alert says so), repeated failed forwards, or nothing at all
# forwarded for a day. Sends a short notice on every start, and a recovery message.
alert_language: en              # en | id
health_alert_enabled: true
health_alert_channel_id:        # empty = DM the owner of this bot's Discord application
health_stall_minutes: 60
health_fail_ratio: 0.5
health_fail_sweeps: 3
health_forward_failures: 5
health_quiet_hours: 24
health_repeat_hours: 6
health_disk_free_gb: 5       # warn when the server's disk runs low

# Upload handling
max_upload_mb: 10         # your server's upload cap: 10 (no boost), 50 (Level 2), 100 (Level 3)
compress_oversize: true   # try ffmpeg compression before falling back to a link
compress_timeout: 120     # kill an ffmpeg compress that runs longer than this (seconds)
